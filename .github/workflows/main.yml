name: 微博监控

on:
  schedule:
    - cron: '0 23 * * *'  # 7点北京
    - cron: '0 0 * * *'   # 8点北京
    - cron: '0 1 * * *'   # 9点北京
    - cron: '0 2 * * *'   # 10点北京
    - cron: '0 4 * * *'   # 12点北京
    - cron: '0 7 * * *'   # 15点北京
    - cron: '0 8 * * *'   # 16点北京
    - cron: '0 9 * * *'   # 17点北京
    - cron: '0 10 * * *'  # 18点北京
    - cron: '0 11 * * *'  # 19点北京
    - cron: '0 12 * * *'  # 20点北京
    - cron: '0 13 * * *'  # 21点北京
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dateutil pytz lark-oapi
      - run: python weibo.py
      - name: 提交状态文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update status $(date '+%Y-%m-%d %H:%M')
          file_pattern: last_processed_id.txt
      - if: ${{ always() }}
        run: |
          if [ -n "$NEW_SUB_COOKIE" ]; then
            echo "$NEW_SUB_COOKIE" | gh secret set WEIBO_SUB_COOKIE -b - --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
