name: 微博监控

on:
  schedule:
    - cron: '0 23 * * *'  # 7点北京
    - cron: '0 0 * * *'   # 8点北京
    - cron: '0 1 * * *'   # 9点北京
    - cron: '0 2 * * *'   # 10点北京
    - cron: '0 4 * * *'   # 12点北京
    - cron: '0 7 * * *'   # 15点北京
    - cron: '0 8 * * *'   # 16点北京
    - cron: '0 9 * * *'   # 17点北京
    - cron: '0 10 * * *'  # 18点北京
    - cron: '0 11 * * *'  # 19点北京
    - cron: '0 12 * * *'  # 20点北京
    - cron: '0 13 * * *'  # 21点北京
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dateutil pytz lark-oapi
      - name: 运行监控脚本
        id: monitor
        run: |
          # 手动触发(workflow_dispatch)跳过冷却，直接发二维码
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python weibo.py --trigger
          else
            # 定时任务：正常模式（带冷却、带轮询）
            python weibo.py
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: 保存新 Cookie
        if: ${{ always() && steps.monitor.outputs.NEW_SUB_COOKIE != '' }}
        run: |
          echo "${{ steps.monitor.outputs.NEW_SUB_COOKIE }}" | gh secret set WEIBO_SUB_COOKIE -b - --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 提交状态文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update status $(date '+%Y-%m-%d %H:%M')
          file_pattern: last_processed_id.txt
