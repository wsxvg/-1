name: Douyin Auto Sender

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  douyin-sender:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install DrissionPage requests

      - name: Run Douyin sender
        run: python 1.py
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DOUYIN_PWD: ${{ secrets.DOUYIN_PWD }}
