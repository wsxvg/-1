name: 微博监控

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分钟执行一次（GitHub Actions 允许的最高频率）
  workflow_dispatch:       # 保留手动触发按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dateutil pytz lark-oapi opencv-python-headless numpy
      - name: 运行监控脚本
        id: monitor
        run: |
          # 手动触发(workflow_dispatch)跳过冷却，直接发二维码
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python weibo.py --trigger
          else
            # 定时任务：正常模式（带冷却、带轮询）
            python weibo.py
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: 提交状态文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update status $(date '+%Y-%m-%d %H:%M')
          file_pattern: last_processed_id.txt
